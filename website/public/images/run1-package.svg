<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Line-art illustration of a crushed cardboard box with a torn shipping label">
  <!-- PLACEHOLDER ILLUSTRATION — swap for a real capture later. -->
  <rect width="400" height="300" fill="#0E1014" />
  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#1E2230" />

  <!-- faint floor / shadow -->
  <ellipse cx="200" cy="252" rx="128" ry="14" fill="#000000" opacity="0.35" />

  <!-- crushed box body: dented top edge, caved-in side -->
  <g stroke="#6B7280" stroke-width="2.2" stroke-linejoin="round" fill="#1A1D24">
    <path d="M96 132 L150 108 L214 120 L266 102 L312 124 L300 224 L226 248 L120 236 L92 196 Z" />
  </g>
  <!-- crease / dent lines on the box face -->
  <g stroke="#4B5160" stroke-width="1.4" fill="none" opacity="0.9">
    <path d="M150 108 L162 168 L120 236" />
    <path d="M214 120 L208 186 L226 248" />
    <path d="M162 168 L208 186 L300 224" />
    <path d="M92 196 L162 168" />
  </g>
  <!-- buckled / dented corner accent -->
  <path d="M266 102 L300 124 L288 150 L252 138 Z" fill="#23262F" stroke="#4B5160" stroke-width="1.4" stroke-linejoin="round" />

  <!-- torn shipping label, split across a jagged tear -->
  <!-- left half of label -->
  <path d="M132 150 L186 142 L190 154 L176 200 L120 206 L126 162 Z" fill="#15181F" stroke="#F5A623" stroke-width="1.8" stroke-linejoin="round" />
  <!-- right half, shifted + rotated to read as torn away -->
  <path d="M196 146 L236 152 L230 198 L182 204 L186 156 Z" fill="#15181F" stroke="#FF5C5C" stroke-width="1.8" stroke-linejoin="round" />

  <!-- jagged tear seam between the halves -->
  <path d="M190 140 L184 152 L194 160 L185 170 L195 180 L186 192 L192 206"
        fill="none" stroke="#FF5C5C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />

  <!-- ripped barcode: bars cut off by the tear -->
  <g stroke="#AEB6CE" stroke-width="2">
    <line x1="134" y1="166" x2="134" y2="190" />
    <line x1="139" y1="166" x2="139" y2="190" />
    <line x1="143" y1="166" x2="143" y2="190" />
    <line x1="149" y1="166" x2="149" y2="190" />
    <line x1="153" y1="166" x2="153" y2="190" />
    <line x1="159" y1="166" x2="159" y2="190" />
    <line x1="163" y1="166" x2="163" y2="190" />
    <line x1="169" y1="166" x2="169" y2="190" />
  </g>
  <!-- barcode fragments on the torn-away half (misaligned) -->
  <g stroke="#6B7280" stroke-width="2" opacity="0.85">
    <line x1="202" y1="170" x2="202" y2="192" />
    <line x1="207" y1="170" x2="207" y2="192" />
    <line x1="213" y1="170" x2="213" y2="192" />
    <line x1="219" y1="170" x2="219" y2="192" />
  </g>

  <!-- unreadable tracking line under the barcode (broken) -->
  <line x1="132" y1="198" x2="172" y2="198" stroke="#8B92A8" stroke-width="2.4" stroke-dasharray="6 5" opacity="0.7" />

  <!-- caption -->
  <text x="20" y="282" fill="#8B92A8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">run1-package.svg · placeholder</text>
</svg>
