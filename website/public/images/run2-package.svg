<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Line-art illustration of an intact cardboard box with a clean, readable shipping label">
  <!-- PLACEHOLDER ILLUSTRATION — swap for a real capture later. -->
  <rect width="400" height="300" fill="#0E1014" />
  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#1E2230" />

  <!-- faint floor / shadow -->
  <ellipse cx="200" cy="252" rx="120" ry="13" fill="#000000" opacity="0.35" />

  <!-- intact box: clean isometric carton -->
  <g stroke="#6B7280" stroke-width="2.2" stroke-linejoin="round">
    <!-- front face -->
    <path d="M112 132 L200 156 L200 244 L112 220 Z" fill="#1A1D24" />
    <!-- right face -->
    <path d="M200 156 L292 132 L292 220 L200 244 Z" fill="#15181F" />
    <!-- top face -->
    <path d="M112 132 L200 108 L292 132 L200 156 Z" fill="#23262F" />
  </g>
  <!-- box tape seam down the front -->
  <line x1="156" y1="144" x2="156" y2="232" stroke="#4B5160" stroke-width="1.4" opacity="0.8" />
  <!-- top flap seam -->
  <path d="M200 108 L200 156" stroke="#4B5160" stroke-width="1.4" opacity="0.8" />

  <!-- light scuff marks (subtle) -->
  <g stroke="#3A3F4D" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M128 176 q8 -4 16 1" />
    <path d="M236 168 q7 5 15 1" />
  </g>

  <!-- crisp shipping label, fully intact -->
  <rect x="120" y="162" width="62" height="56" rx="2" fill="#15181F" stroke="#3DD68C" stroke-width="1.8" />
  <!-- clean, complete barcode -->
  <g stroke="#AEB6CE" stroke-width="2">
    <line x1="127" y1="172" x2="127" y2="196" />
    <line x1="131" y1="172" x2="131" y2="196" />
    <line x1="136" y1="172" x2="136" y2="196" />
    <line x1="140" y1="172" x2="140" y2="196" />
    <line x1="146" y1="172" x2="146" y2="196" />
    <line x1="150" y1="172" x2="150" y2="196" />
    <line x1="155" y1="172" x2="155" y2="196" />
    <line x1="159" y1="172" x2="159" y2="196" />
    <line x1="164" y1="172" x2="164" y2="196" />
    <line x1="168" y1="172" x2="168" y2="196" />
    <line x1="173" y1="172" x2="173" y2="196" />
  </g>
  <!-- clean readable tracking line under the barcode -->
  <line x1="127" y1="204" x2="175" y2="204" stroke="#AEB6CE" stroke-width="2.4" opacity="0.9" />
  <line x1="127" y1="210" x2="160" y2="210" stroke="#6B7280" stroke-width="1.8" opacity="0.7" />

  <!-- small green check accent (label verified) -->
  <g transform="translate(252 176)">
    <circle cx="0" cy="0" r="14" fill="#0F3D24" stroke="#3DD68C" stroke-width="1.8" />
    <path d="M-6 0 L-2 5 L7 -6" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- caption -->
  <text x="20" y="282" fill="#8B92A8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">run2-package.svg · placeholder</text>
</svg>
